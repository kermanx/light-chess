name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Install browser dependencies
        run: |
          # The Azure mirror can stall font downloads on hosted runners.
          for mirror_list in /etc/apt/apt-mirrors*.txt; do
            [ -f "$mirror_list" ] || continue
            sudo sed -i 's|http://azure.archive.ubuntu.com/ubuntu|http://archive.ubuntu.com/ubuntu|g' "$mirror_list"
          done
          npx playwright install --with-deps chromium
      - name: Check multiplayer without WebRTC
        run: node scripts/relay-check.mjs
      - name: Check enclosure rule interactions
        run: node scripts/enclosure-check.mjs
      - name: Check victory animation and confirmation
        run: node scripts/victory-check.mjs
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
